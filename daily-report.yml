name: Daily Zoho CRM Report

on:
  schedule:
    # cron 是 UTC 時間。這裡設定 UTC 00:00 = 台北時間(UTC+8) 08:00。
    # 要改成別的時間，把下面這行的 "0 0" 換成 "分鐘 (小時-8)"，例如台北 09:30 就寫 "30 1"。
    - cron: "0 0 * * *"
  workflow_dispatch: {}   # 允許在 GitHub 網頁上手動按「Run workflow」立即跑一次，方便測試

permissions:
  contents: write

jobs:
  build-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate report
        env:
          ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
          ZOHO_ACCOUNTS_DOMAIN: ${{ secrets.ZOHO_ACCOUNTS_DOMAIN }}
          ZOHO_API_DOMAIN: ${{ secrets.ZOHO_API_DOMAIN }}
        run: python scripts/generate_report.py

      - name: Commit updated report
        run: |
          git config user.name "cyberbiz-report-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html data/stage_cache.json
          git diff --quiet --cached || git commit -m "chore: 每日自動更新報表 $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
