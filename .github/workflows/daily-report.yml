name: Daily Zoho CRM Report

on:
  schedule:
    # cron 是 UTC 時間。這裡設定 UTC 00:17 = 台北時間(UTC+8) 08:17。
    # 故意不用整點（00:00），因為全世界一堆 repo 都排在整點觸發，GitHub 那邊會塞車，
    # 常常延遲很久才真的執行；分鐘數錯開一點可以大幅降低塞車機率。
    # 要改成別的時間，把下面這行的 "17 0" 換成 "分鐘 (小時-8)"，例如台北 09:30 就寫 "30 1"。
    - cron: "17 0 * * *"
  workflow_dispatch:      # 允許在 GitHub 網頁上手動按「Run workflow」立即跑一次，方便測試
    inputs:
      test_mode:
        description: "測試模式：業務個人提醒信會全部改寄到你自己信箱，不會真的寄給業務（正式排程不受影響，一律正常寄送）"
        type: choice
        options:
          - "true"
          - "false"
        default: "true"
      reassign_full_backfill:
        description: "重分配全量回補：選 true 的話這次不受最近 3 天限制，會把 2026/1/1 至今所有還在「重分配」階段、還沒被通知過的交易一次補寄出去。只有第一次上線要清歷史積壓時才選 true，補完之後下次 Run workflow 記得改回 false，平常的排程也一律是 false。"
        type: choice
        options:
          - "false"
          - "true"
        default: "false"
      owner_change_backfill:
        description: "舊交易換Owner回補：選 true 的話會逐一檢查建立時間在2026/1/1前、但目前還卡在追蹤階段的舊交易，只有真的在2026/1/1後換過Owner的才會補進追蹤（其他當初只是被系統批次動過的舊資料不會)。候選量可能有幾千筆，會逐筆呼叫Timeline API，跑很久。只有第一次上線要清歷史積壓時才選true，跑完記得改回false，平常排程一律是false。"
        type: choice
        options:
          - "false"
          - "true"
        default: "false"

permissions:
  contents: write

jobs:
  build-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate report
        env:
          ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
          ZOHO_ACCOUNTS_DOMAIN: ${{ secrets.ZOHO_ACCOUNTS_DOMAIN }}
          ZOHO_API_DOMAIN: ${{ secrets.ZOHO_API_DOMAIN }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          MANAGER_SUMMARY_EMAIL: ${{ secrets.MANAGER_SUMMARY_EMAIL }}
          # 只有手動 Run workflow、而且測試模式選 true（預設值）時才會生效，
          # 正式的每日排程（schedule 觸發）一定是空字串，一律正常直接寄給業務。
          NOTIFY_TEST_EMAIL: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.test_mode == 'true') && 'eva.ch.lin@cyberbiz.io' || '' }}
          # 只有手動 Run workflow、而且這欄選 true 時才會生效，正式排程一律是 false（只看最近幾天）。
          REASSIGN_FULL_BACKFILL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.reassign_full_backfill == 'true' }}
          # 只有手動 Run workflow、而且這欄選 true 時才會生效，正式排程一律是 false。
          OWNER_CHANGE_BACKFILL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.owner_change_backfill == 'true' }}
        run: python scripts/generate_report.py

      - name: Commit updated report
        run: |
          git config user.name "cyberbiz-report-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html data/stage_cache.json data/gmail_draft_log.json data/reassign_cache.json
          git diff --quiet --cached || git commit -m "chore: 每日自動更新報表 $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
